name: PR Check (High Maturity)

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, ready_for_review, labeled, unlabeled ]
  merge_group:
    types: [ checks_requested ]
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: pr-check-${{  github.event.pull_request.number || github.event.merge_group.head_sha || github.ref  }}
  cancel-in-progress: ${{  github.event_name == 'pull_request'  }}

permissions:
  contents: read

env:
  CI: true

jobs:
  change-scope:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
      tooling_only: ${{ steps.classify.outputs.tooling_only }}
      tooling_changed: ${{ steps.classify.outputs.tooling_changed }}
      source_changed: ${{ steps.classify.outputs.source_changed }}
      gradle_changed: ${{ steps.classify.outputs.gradle_changed }}
      architecture_changed: ${{ steps.classify.outputs.architecture_changed }}
      release_changed: ${{ steps.classify.outputs.release_changed }}
      smoke_changed: ${{ steps.classify.outputs.smoke_changed }}
      unknown_changed: ${{ steps.classify.outputs.unknown_changed }}
      module_gradle_changed: ${{ steps.classify.outputs.module_gradle_changed }}
      baseline_changed: ${{ steps.classify.outputs.baseline_changed }}
      firebase_changed: ${{ steps.classify.outputs.firebase_changed }}
      compile_only_allowed: ${{ steps.classify.outputs.compile_only_allowed }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect documentation-only changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: bash ./.github/scripts/detect-change-scope.sh "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA"

  documentation-validation:
    name: Documentation and issue-form validation
    runs-on: ubuntu-latest
    needs: [ change-scope ]
    if: ${{ needs.change-scope.outputs.docs_changed == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate changed Markdown and GitHub issue forms
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: python3 ./.github/scripts/validate-documentation.py "$BASE_SHA" "$HEAD_SHA"

  tooling-validation:
    name: Script and workflow syntax validation
    runs-on: ubuntu-latest
    needs: [ change-scope ]
    if: ${{ needs.change-scope.outputs.tooling_changed == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate changed scripts and configuration
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: python3 ./.github/scripts/validate-tooling.py "$BASE_SHA" "$HEAD_SHA"

  gradle-configuration-validation:
    name: Gradle configuration validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ change-scope ]
    if: ${{ needs.change-scope.outputs.gradle_changed == 'true' && needs.change-scope.outputs.architecture_changed != 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android local.properties
        run: printf 'sdk.dir=%s\\n' "$ANDROID_HOME" > local.properties

      - name: Prepare Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_DEMO_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_DEMO_BASE64 }}
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 }}
        run: bash ./.github/scripts/prepare-google-services.sh demo prod

      - name: Validate Gradle project configuration
        run: |
          chmod +x ./gradlew
          ./gradlew help --no-configuration-cache --stacktrace --console=plain

  architecture-gate:
    needs: [ change-scope ]
    if: ${{ needs.change-scope.outputs.architecture_changed == 'true' }}
    name: Level 0 - Architecture & Policy
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare main-branch lint baseline reference
        shell: bash
        run: |
          baseline_path="${RUNNER_TEMP}/main-lint-baseline.xml"
          if git cat-file -e "origin/main:lint-baseline.xml" 2>/dev/null; then
            git show "origin/main:lint-baseline.xml" > "$baseline_path"
          else
            rm -f "$baseline_path"
            echo "No lint-baseline.xml exists on origin/main; LAW-040 reference count is zero."
          fi
          echo "MAIN_BASELINE_PATH=$baseline_path" >> "$GITHUB_ENV"

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Run Fast Architecture Regression Suite
        if: ${{  github.event_name == 'pull_request' && github.event.pull_request.draft  }}
        run: >-
          bash ./.github/scripts/run-gradle-with-diagnostics.sh fast-architecture ./gradlew
          :core:ksp-architecture:test
          :core:testing-architecture:test
          :lint:test
          --stacktrace
          --console=plain

      - name: Prepare Firebase configuration for full architecture and lint gates
        if: ${{  github.event_name != 'pull_request' || !github.event.pull_request.draft  }}
        env:
          GOOGLE_SERVICES_JSON_DEMO_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_DEMO_BASE64  }}
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_PROD_BASE64  }}
        run: bash ./.github/scripts/prepare-google-services.sh demo prod
      - name: Run Full Architecture and Lint Gates
        if: ${{  github.event_name != 'pull_request' || !github.event.pull_request.draft  }}
        run: bash ./.github/scripts/run-gradle-with-diagnostics.sh architecture-lint ./gradlew verifyArchitecture lint --no-configuration-cache --stacktrace --console=plain

      - name: Test Build Logic Convention Plugins
        if: ${{  github.event_name != 'pull_request' || !github.event.pull_request.draft  }}
        run: bash ./.github/scripts/run-gradle-with-diagnostics.sh convention-tests ./gradlew -p build-logic :convention:test --no-configuration-cache --stacktrace --console=plain

      - name: Upload Lint Diagnostic Reports
        if: ${{  always() && github.event_name != 'pull_request'  }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-diagnostics
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.sarif
            **/build/intermediates/lint_intermediate_text_report/**/*.txt
          if-no-files-found: warn

      - name: Upload Gradle resource diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-resource-${{ github.run_number }}-${{ github.job }}
          path: ${{ runner.temp }}/gradle-ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 5

  impact-analysis:
    name: Calculate affected module verification tasks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [ change-scope ]
    if: ${{ needs.change-scope.outputs.source_changed == 'true' || needs.change-scope.outputs.module_gradle_changed == 'true' }}
    outputs:
      impact_tasks: ${{ steps.impact.outputs.tasks }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Firebase configuration for impact analysis
        env:
          GOOGLE_SERVICES_JSON_DEMO_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_DEMO_BASE64 }}
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 }}
        run: bash ./.github/scripts/prepare-google-services.sh demo prod

      - name: Calculate impacted module tasks
        id: impact
        env:
          ESTATIA_IMPACT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'origin/main' }}
          ESTATIA_IMPACT_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          ESTATIA_COMPILE_ONLY: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:compile-only') && needs.change-scope.outputs.compile_only_allowed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          bash ./.github/scripts/run-gradle-with-diagnostics.sh impact-calculation ./gradlew calculateImpact --no-configuration-cache --console=plain | tee impact_output.txt
          tasks="$(sed -n 's/^IMPACT_TASKS=//p' impact_output.txt | tail -n 1)"
          if [[ -z "$tasks" ]]; then
            echo "::error::Source changes did not resolve to any verification tasks."
            exit 1
          fi
          if [[ "$tasks" == "test lint" ]]; then
            echo "::warning::Impact analysis selected the conservative full unit-test/lint fallback."
          fi
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
          echo "Selected impacted tasks: $tasks"

      - name: Upload Gradle resource diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-resource-${{ github.run_number }}-${{ github.job }}
          path: ${{ runner.temp }}/gradle-ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 5

  selective-verification:
    name: Level 1 - Impacted Verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [ impact-analysis ]
    if: ${{ needs.impact-analysis.outputs.impact_tasks != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Prepare Firebase configuration for impacted verification
        env:
          GOOGLE_SERVICES_JSON_DEMO_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_DEMO_BASE64  }}
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_PROD_BASE64  }}
          FULL_VALIDATION: ${{  github.event_name != 'pull_request' || !github.event.pull_request.draft  }}
        shell: bash
        run: |
          if [[ "$FULL_VALIDATION" == "true" ]]; then
            bash ./.github/scripts/prepare-google-services.sh demo prod
          else
            bash ./.github/scripts/prepare-google-services.sh demo
          fi

      - name: Run Impacted Tasks and Coverage Ratchet
        env:
          IMPACT_TASKS: ${{  needs.impact-analysis.outputs.impact_tasks  }}
        shell: bash
        run: |
          read -r -a tasks <<< "$IMPACT_TASKS"
          bash ./.github/scripts/run-gradle-with-diagnostics.sh impacted-verification ./gradlew "${tasks[@]}" --no-configuration-cache --stacktrace --console=plain

      - name: Upload Gradle resource diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-resource-${{ github.run_number }}-${{ github.job }}
          path: ${{ runner.temp }}/gradle-ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 5

  release-r8-validation:
    needs: [ change-scope, gradle-configuration-validation, architecture-gate, selective-verification ]
    name: Level 3 - Minified Release (R8 / Protobuf)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GRADLE_CI_MAX_WORKERS: 2
    if: ${{ always() && needs.change-scope.outputs.release_changed == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.gradle-configuration-validation.result == 'success' || needs.gradle-configuration-validation.result == 'skipped') && (needs.architecture-gate.result == 'success' || needs.architecture-gate.result == 'skipped') && (needs.selective-verification.result == 'success' || (needs.change-scope.outputs.source_changed != 'true' && needs.change-scope.outputs.module_gradle_changed != 'true')) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android SDK properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Prepare Firebase configuration (Demo + Prod)
        env:
          GOOGLE_SERVICES_JSON_DEMO_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_DEMO_BASE64  }}
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_PROD_BASE64  }}
        run: bash ./.github/scripts/prepare-google-services.sh demo prod

      # Both release flavors are minified; PR validation does not require signing secrets.
      - name: Assemble Minified Demo and Production Releases
        run: bash ./.github/scripts/run-gradle-with-diagnostics.sh dual-flavor-release ./gradlew :app:assembleDemoRelease :app:assembleProdRelease --no-configuration-cache --stacktrace --console=plain

      - name: Verify R8 Outputs for Both Release Flavors
        shell: bash
        run: |
          for flavor in demo prod; do
            variant="${flavor}Release"
            test -s "app/build/outputs/mapping/${variant}/mapping.txt"
            test -s "app/build/outputs/apk/${flavor}/release/app-${flavor}-release-unsigned.apk" \
              || test -s "app/build/outputs/apk/${flavor}/release/app-${flavor}-release.apk"
          done

      - name: Upload Gradle resource diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-resource-${{ github.run_number }}-${{ github.job }}
          path: ${{ runner.temp }}/gradle-ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 5

  smoke-test:
    name: Level 2 - Smoke UI (Pixel 2)
    runs-on: ubuntu-24.04
    needs: [ change-scope, selective-verification ]
    timeout-minutes: 75
    env:
      GRADLE_CI_MAX_WORKERS: 2
    if: ${{ always() && needs.change-scope.outputs.smoke_changed == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.selective-verification.result == 'success' || needs.change-scope.outputs.source_changed != 'true') }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Prepare Firebase configuration (Demo + Prod)
        env:
          GOOGLE_SERVICES_JSON_DEMO_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_DEMO_BASE64  }}
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_PROD_BASE64  }}
        run: bash ./.github/scripts/prepare-google-services.sh demo prod

      - name: Compile all module instrumented test source sets
        run: |
          bash ./.github/scripts/run-gradle-with-diagnostics.sh instrumentation-compile ./gradlew \
            :app:assembleDemoDebugAndroidTest \
            :app:assembleProdDebugAndroidTest \
            :core:common:assembleDemoDebugAndroidTest \
            :core:common:assembleProdDebugAndroidTest \
            :core:database:assembleDemoDebugAndroidTest \
            :core:database:assembleProdDebugAndroidTest \
            :core:datastore:assembleDemoDebugAndroidTest \
            :core:datastore:assembleProdDebugAndroidTest \
            :core:player-ui:assembleDemoDebugAndroidTest \
            :core:player-ui:assembleProdDebugAndroidTest \
            --no-configuration-cache --stacktrace --console=plain

      - name: Run shared local API 34 smoke UI diagnostics
        uses: ./.github/actions/smoke-ui-local
        with:
          artifact_name: smoke-ui-pr-${{ github.run_number }}

      - name: Upload Gradle resource diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-resource-${{ github.run_number }}-${{ github.job }}
          path: ${{ runner.temp }}/gradle-ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 5
