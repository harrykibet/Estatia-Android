name: Batch Branch Cleanup

on:
  workflow_dispatch:
    inputs:
      branches:
        description: "Optional JSON array of exact branch names. Leave empty to audit all remote branches (forced dry run)."
        required: false
        default: ""
        type: string
      dry_run:
        description: "For explicitly supplied branches only: preview when true, delete when false. Empty branch input always forces a full dry run."
        required: true
        default: true
        type: boolean

# Read-only by default. Only the explicit execution job receives contents:write.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: branch-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test branch cleanup parser and safety guards
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run branch cleanup unit tests
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v

  inventory:
    name: Full remote branch inventory (read-only)
    needs: validate
    if: ${{ inputs.branches == '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Enumerate every remote branch (forced dry run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::No branch list supplied. Enumerating every remote branch with a read-only token; deletion is unavailable in this job."
          python3 .github/scripts/delete-branches.py \
            --repo "${GITHUB_REPOSITORY}" \
            --protect-file .github/branch-deletion-protected.txt \
            --all-branches --dry-run

  preview-selected:
    name: Preview explicitly selected branches (read-only)
    needs: validate
    if: ${{ inputs.branches != '' && inputs.dry_run == true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Preview explicit branch selection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCHES_INPUT: ${{ inputs.branches }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${BRANCHES_INPUT}" | \
            python3 .github/scripts/delete-branches.py \
              --repo "${GITHUB_REPOSITORY}" \
              --protect-file .github/branch-deletion-protected.txt \
              --from-stdin --dry-run

  delete-selected:
    name: Delete explicitly selected branches
    needs: validate
    if: ${{ inputs.branches != '' && inputs.dry_run == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Delete explicitly selected branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCHES_INPUT: ${{ inputs.branches }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${BRANCHES_INPUT}" | \
            python3 .github/scripts/delete-branches.py \
              --repo "${GITHUB_REPOSITORY}" \
              --protect-file .github/branch-deletion-protected.txt \
              --from-stdin --execute
