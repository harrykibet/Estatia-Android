name: Baseline Profile Instrumentation Diagnostics

run-name: "Baseline Profile diagnostics - ${{ github.ref_name }} #${{ github.run_number }}"

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - "app/**"
      - "benchmark/**"
      - "core/**"
      - "feature/**"
      - "build-logic/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/scripts/prepare-google-services.sh"
      - ".github/scripts/prepare-android-emulator.sh"
      - ".github/scripts/start-connected-android-emulator.sh"
      - ".github/scripts/stop-connected-android-emulator.sh"
      - ".github/scripts/run-gradle-with-diagnostics.sh"
      - ".github/workflows/baseline-profile-diagnostics.yml"
  workflow_dispatch:

concurrency:
  group: baseline-profile-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  ANDROID_SERIAL: emulator-5554
  GRADLE_CI_MAX_WORKERS: 2
  GRADLE_CI_GRADLE_XMX: 5g
  GRADLE_CI_KOTLIN_XMX: 2g

jobs:
  demo-baseline-profile:
    name: Demo NonMinifiedRelease instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android local.properties
        run: printf 'sdk.dir=%s\\n' "$ANDROID_HOME" > local.properties

      - name: Set executable permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Prepare Demo Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_DEMO_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_DEMO_BASE64 }}
        run: bash ./.github/scripts/prepare-google-services.sh demo

      - name: Prepare KVM and Android Emulator
        run: bash ./.github/scripts/prepare-android-emulator.sh

      - name: Start connected Android Emulator
        run: bash ./.github/scripts/start-connected-android-emulator.sh

      - name: Clear emulator logcat before instrumentation
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/platform-tools/adb" -s "$ANDROID_SERIAL" logcat -c

      - name: Run only the failing Demo baseline-profile instrumentation task
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline-profile-diagnostics"
          bash ./.github/scripts/run-gradle-with-diagnostics.sh \\
            baseline-profile-demo-instrumentation \\
            ./gradlew \\
            :benchmark:connectedDemoNonMinifiedReleaseAndroidTest \\
            --no-configuration-cache \\
            --stacktrace \\
            --info \\
            --console=plain 2>&1 | tee "$RUNNER_TEMP/baseline-profile-diagnostics/gradle-task.log"

      - name: Capture emulator diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          diagnostics_dir="$RUNNER_TEMP/baseline-profile-diagnostics"
          mkdir -p "$diagnostics_dir"
          adb="$ANDROID_HOME/platform-tools/adb"

          if [[ -x "$adb" ]]; then
            "$adb" devices -l > "$diagnostics_dir/adb-devices.txt" 2>&1
            if "$adb" -s "$ANDROID_SERIAL" get-state >/dev/null 2>&1; then
              "$adb" -s "$ANDROID_SERIAL" logcat -d -v threadtime > "$diagnostics_dir/logcat.txt" 2>&1
              "$adb" -s "$ANDROID_SERIAL" shell dumpsys activity activities > "$diagnostics_dir/activity.txt" 2>&1
              "$adb" -s "$ANDROID_SERIAL" shell dumpsys window windows > "$diagnostics_dir/windows.txt" 2>&1
              "$adb" -s "$ANDROID_SERIAL" exec-out screencap -p > "$diagnostics_dir/screen.png" 2>/dev/null
            fi
          fi

          exit 0

      - name: Stop connected Android Emulator
        if: always()
        run: bash ./.github/scripts/stop-connected-android-emulator.sh

      - name: Upload instrumentation and environment reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile-diagnostics-${{ github.run_id }}
          path: |
            benchmark/build/reports/androidTests/connected/**
            benchmark/build/outputs/androidTest-results/connected/**
            benchmark/build/outputs/connected_android_test_additional_output/**
            benchmark/build/test-results/**
            build/reports/problems/**
            ${{ runner.temp }}/gradle-ci-diagnostics/**
            ${{ runner.temp }}/baseline-profile-diagnostics/**
          if-no-files-found: warn
          retention-days: 7
