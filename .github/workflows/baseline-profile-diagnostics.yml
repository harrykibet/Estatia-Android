name: Baseline Profile Generation Diagnostics

run-name: "Baseline Profile generation - ${{ github.ref_name }} #${{ github.run_number }}"

on:
  pull_request:
    branches: [ "main", "security/server-authoritative-property-likes" ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ "main" ]
  merge_group:
    types: [ checks_requested ]
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  # A push to a PR that will not generate profiles (no ci:profile label) is skipped and
  # gets its own group so it cannot cancel an in-flight generation run for the same PR.
  group: baseline-profile-diagnostics-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'synchronize' && !contains(github.event.pull_request.labels.*.name, 'ci:profile') && 'skip' || 'run' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  ANDROID_SERIAL: emulator-5554
  GRADLE_CI_MAX_WORKERS: 1
  GRADLE_CI_GRADLE_XMX: 4608m
  GRADLE_CI_KOTLIN_XMX: 1536m
  GRADLE_CI_PARALLEL: "false"
  GRADLE_CI_KOTLIN_PARALLEL: "false"
  GRADLE_CI_SAMPLE_SECONDS: 30

jobs:
  change-scope:
    name: Classify baseline-profile changes
    runs-on: ubuntu-latest
    outputs:
      baseline_changed: ${{ steps.classify.outputs.baseline_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Classify relevant changes
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: bash ./.github/scripts/detect-change-scope.sh "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA"

  variant-baseline-profile:
    needs: [ change-scope ]
    # Profile generation takes 30-45 minutes and its output is not committed on a PR, so
    # on a PR it only proves the pipeline still works. Run it when the PR is opened,
    # reopened or marked ready (never for drafts), or on every push when the PR carries
    # the `ci:profile` label. It always runs on pushes to main, dispatch and merge_group.
    if: >-
      ${{ needs.change-scope.outputs.baseline_changed == 'true' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.user.login != 'dependabot[bot]' &&
      !github.event.pull_request.draft &&
      (github.event.action != 'synchronize' ||
      contains(github.event.pull_request.labels.*.name, 'ci:profile')))) }}
    name: ${{ matrix.variant }} release profile generation and packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: demo
            variant: Demo
          - flavor: prod
            variant: Prod

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic

      - name: Prepare Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Set executable permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Prepare Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_DEMO_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_DEMO_BASE64 }}
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 }}
        run: bash ./.github/scripts/prepare-google-services.sh "${{ matrix.flavor }}"

      - name: Validate production benchmark account secrets
        if: matrix.flavor == 'prod'
        env:
          BASELINE_PROFILE_TEST_EMAIL: ${{ secrets.BASELINE_PROFILE_TEST_EMAIL }}
          BASELINE_PROFILE_TEST_PASSWORD: ${{ secrets.BASELINE_PROFILE_TEST_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${BASELINE_PROFILE_TEST_EMAIL:-}" ]] || {
            echo "::error::Missing BASELINE_PROFILE_TEST_EMAIL repository secret."
            exit 1
          }
          [[ -n "${BASELINE_PROFILE_TEST_PASSWORD:-}" ]] || {
            echo "::error::Missing BASELINE_PROFILE_TEST_PASSWORD repository secret."
            exit 1
          }
          echo "Production benchmark account secrets are present; values are not printed."

      - name: Compile app and benchmark instrumentation before emulator provisioning
        shell: bash
        run: |
          set -euo pipefail

          # Each matrix job receives only its own flavor's Firebase JSON secret.
          # Compile that same release variant so Gradle never expects the other
          # flavor's configuration in this isolated job.
          variant="${{ matrix.variant }}"
          variant_lower="${variant,,}"
          bash ./.github/scripts/run-gradle-with-diagnostics.sh "${variant_lower}-release-app-compile" \
            ./gradlew ":app:compile${variant}ReleaseKotlin" \
            --no-configuration-cache --stacktrace --console=plain

          # Android Test variants are created by the benchmark plugin. Discover
          # only this matrix flavor's instrumentation Kotlin compile tasks.
          # Keep discovery visible in Actions logs while retaining it for parsing.
          task_listing_file="$RUNNER_TEMP/${variant_lower}-benchmark-tasks.txt"
          bash ./.github/scripts/run-gradle-with-diagnostics.sh "${variant_lower}-benchmark-task-discovery" \
            ./gradlew :benchmark:tasks --all --no-configuration-cache --console=plain \
            | tee "$task_listing_file"
          mapfile -t benchmark_compile_tasks < <(
            grep -Eo "compile${variant}[A-Za-z0-9]*Kotlin" "$task_listing_file" |
              sort -u
          )
          if [[ "${#benchmark_compile_tasks[@]}" -eq 0 ]]; then
            echo "::error::Could not discover ${variant} benchmark Kotlin compile tasks."
            grep -E "compile${variant}.*Kotlin" "$task_listing_file" || true
            exit 1
          fi

          printf 'Compiling benchmark instrumentation tasks:\n'
          printf '  %s\n' "${benchmark_compile_tasks[@]}"
          bash ./.github/scripts/run-gradle-with-diagnostics.sh "${variant_lower}-benchmark-instrumentation-compile" \
            ./gradlew "${benchmark_compile_tasks[@]}" --no-configuration-cache --stacktrace --console=plain

      - name: Prepare KVM and Android Emulator
        run: bash ./.github/scripts/prepare-android-emulator.sh

      - name: Start connected Android Emulator
        run: bash ./.github/scripts/start-connected-android-emulator.sh

      - name: Clear emulator logcat before profile generation
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/platform-tools/adb" -s "$ANDROID_SERIAL" logcat -c

      - name: Generate and save variant Baseline and Startup Profiles
        shell: bash
        timeout-minutes: 90
        env:
          BASELINE_PROFILE_TEST_EMAIL: ${{ matrix.flavor == 'prod' && secrets.BASELINE_PROFILE_TEST_EMAIL || '' }}
          BASELINE_PROFILE_TEST_PASSWORD: ${{ matrix.flavor == 'prod' && secrets.BASELINE_PROFILE_TEST_PASSWORD || '' }}
        run: |
          set -euo pipefail
          task=":app:generate${{ matrix.variant }}ReleaseBaselineProfile"
          if [[ "${{ matrix.flavor }}" == "prod" ]]; then
            # benchmark/build.gradle.kts reads these from the environment (not -P flags).
            [[ -n "${BASELINE_PROFILE_TEST_EMAIL:-}" && -n "${BASELINE_PROFILE_TEST_PASSWORD:-}" ]] || {
              echo "::error::Production benchmark credentials are required."
              exit 1
            }
          fi
          mkdir -p "$RUNNER_TEMP/baseline-profile-validation"
          bash ./.github/scripts/run-gradle-with-diagnostics.sh "${{ matrix.flavor }}-baseline-profile-generation" \
            ./gradlew "$task" \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile \
            --no-configuration-cache --stacktrace --console=plain \
            2>&1 | tee "$RUNNER_TEMP/baseline-profile-validation/generation-${{ matrix.flavor }}.log"

      - name: Capture emulator diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          diagnostics_dir="$RUNNER_TEMP/baseline-profile-validation"
          mkdir -p "$diagnostics_dir"
          adb="$ANDROID_HOME/platform-tools/adb"

          if [[ -x "$adb" ]]; then
            "$adb" devices -l > "$diagnostics_dir/adb-devices.txt" 2>&1
            if "$adb" -s "$ANDROID_SERIAL" get-state >/dev/null 2>&1; then
              "$adb" -s "$ANDROID_SERIAL" logcat -d -v threadtime > "$diagnostics_dir/logcat.txt" 2>&1
              "$adb" -s "$ANDROID_SERIAL" shell dumpsys activity activities > "$diagnostics_dir/activity.txt" 2>&1
              "$adb" -s "$ANDROID_SERIAL" shell dumpsys window windows > "$diagnostics_dir/windows.txt" 2>&1
              "$adb" -s "$ANDROID_SERIAL" exec-out screencap -p > "$diagnostics_dir/screen.png" 2>/dev/null
            fi
          fi
          exit 0

      - name: Stop connected Android Emulator
        if: always()
        run: bash ./.github/scripts/stop-connected-android-emulator.sh

      - name: Verify generated variant source profiles
        shell: bash
        run: |
          set -euo pipefail
          profile_dir="app/src/${{ matrix.flavor }}Release/generated/baselineProfiles"
          report="$RUNNER_TEMP/baseline-profile-validation/source-${{ matrix.flavor }}.txt"
          python3 - "$profile_dir" "$report" "${{ matrix.variant }}" <<'PY'
          import pathlib
          import sys

          profile_dir = pathlib.Path(sys.argv[1])
          report = pathlib.Path(sys.argv[2])
          variant = sys.argv[3]
          expected = ("baseline-prof.txt", "startup-prof.txt")
          rows = [f"Variant: {variant}Release", f"Source directory: {profile_dir}"]

          for name in expected:
              path = profile_dir / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty generated profile: {path}")
              text = path.read_text(encoding="utf-8")
              rule_count = sum(1 for line in text.splitlines() if line.strip())
              if rule_count == 0:
                  raise SystemExit(f"Generated profile has no rules: {path}")
              rows.append(f"{name}: {path.stat().st_size} bytes, {rule_count} non-empty rules")

          report.write_text("\n".join(rows) + "\n", encoding="utf-8")
          print("\n".join(rows))
          PY

      - name: Assemble minified variant release APK
        shell: bash
        run: |
          set -euo pipefail
          task=":app:assemble${{ matrix.variant }}Release"
          bash ./.github/scripts/run-gradle-with-diagnostics.sh "${{ matrix.flavor }}-profiled-release-assembly" \
            ./gradlew "$task" --no-configuration-cache --stacktrace --console=plain

      - name: Verify packaged Baseline Profile and binary size
        shell: bash
        run: |
          set -euo pipefail
          flavor="${{ matrix.flavor }}"
          apk_dir="app/build/outputs/apk/$flavor/release"
          apk=""
          for candidate in \
            "$apk_dir/app-$flavor-release-unsigned.apk" \
            "$apk_dir/app-$flavor-release.apk"; do
            if [[ -s "$candidate" ]]; then
              apk="$candidate"
              break
            fi
          done
          if [[ -z "$apk" ]]; then
            echo "::error::Could not find the packaged $flavor release APK in $apk_dir."
            find "$apk_dir" -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi

          python3 - "$apk" "app/src/${flavor}Release/generated/baselineProfiles" \
            "$RUNNER_TEMP/baseline-profile-validation/package-$flavor.txt" "${{ matrix.variant }}" <<'PY'
          import hashlib
          import os
          import pathlib
          import sys
          import zipfile

          apk = pathlib.Path(sys.argv[1])
          source_dir = pathlib.Path(sys.argv[2])
          report = pathlib.Path(sys.argv[3])
          variant = sys.argv[4]
          profile_entry = "assets/dexopt/baseline.prof"
          max_profile_bytes = 1_500_000

          with zipfile.ZipFile(apk) as archive:
              bad_entry = archive.testzip()
              if bad_entry is not None:
                  raise SystemExit(f"APK ZIP integrity check failed at {bad_entry}")
              names = set(archive.namelist())
              if profile_entry not in names:
                  candidates = sorted(name for name in names if "baseline.prof" in name)
                  raise SystemExit(
                      f"{profile_entry} is missing from {apk}; profile-like entries: {candidates}"
                  )
              profile_bytes = archive.getinfo(profile_entry).file_size
              if profile_bytes <= 0:
                  raise SystemExit("Packaged assets/dexopt/baseline.prof is empty")
              if profile_bytes >= max_profile_bytes:
                  raise SystemExit(
                      f"Packaged binary Baseline Profile is {profile_bytes} bytes; "
                      f"must be smaller than {max_profile_bytes} bytes (1.5 MB)"
                  )

          baseline = source_dir / "baseline-prof.txt"
          startup = source_dir / "startup-prof.txt"
          digest = hashlib.sha256()
          with apk.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)
          apk_digest = digest.hexdigest()
          lines = [
              f"APK: {apk}",
              f"APK bytes: {apk.stat().st_size}",
              f"APK SHA-256: {apk_digest}",
              f"Packaged profile: {profile_entry}",
              f"Packaged binary profile bytes: {profile_bytes}",
              f"Baseline source bytes: {baseline.stat().st_size}",
              f"Startup source bytes: {startup.stat().st_size}",
              "Result: PASS",
          ]
          report.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(f"### {source_dir.parts[2].title()} Baseline Profile validation\n\n")
              summary.write("\n".join(f"- {line}" for line in lines[1:]) + "\n\n")
          PY

      - name: Record live Storage coverage boundary
        if: matrix.flavor == 'prod'
        shell: bash
        run: |
          {
            echo "### Firebase Storage coverage"
            echo
            echo "Live Firebase Storage is not exercised by Baseline Profile generation."
            echo "The authenticated profile validates live Firebase Auth and Firestore paths."
            echo "Storage SDK upload/download is validated separately against the Firebase Storage Emulator."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scrub artifacts for credential material
        id: scrub-artifacts
        if: always()
        shell: bash
        env:
          BASELINE_PROFILE_TEST_PASSWORD: ${{ matrix.flavor == 'prod' && secrets.BASELINE_PROFILE_TEST_PASSWORD || '' }}
        run: |
          bash ./.github/scripts/scrub-check-secrets.sh \
            --dirs \
              "app/src/${{ matrix.flavor }}Release/generated/baselineProfiles" \
              "$RUNNER_TEMP/baseline-profile-validation" \
              "$RUNNER_TEMP/gradle-ci-diagnostics" \
            -- BASELINE_PROFILE_TEST_PASSWORD

      - name: Upload generated profiles and validation reports
        if: ${{ always() && steps.scrub-artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: baseline-profile-validation-${{ matrix.flavor }}-${{ github.run_id }}
          path: |
            app/src/${{ matrix.flavor }}Release/generated/baselineProfiles/*.txt
            ${{ runner.temp }}/baseline-profile-validation/
            ${{ runner.temp }}/gradle-ci-diagnostics/**
          if-no-files-found: warn
          retention-days: 7

  ci-gate:
    name: Baseline Profile Gate
    runs-on: ubuntu-latest
    needs:
      - change-scope
      - variant-baseline-profile
    if: ${{ always() }}
    steps:
      - name: Checkout gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
      - name: Verify all executed checks completed successfully
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci-gate.py
