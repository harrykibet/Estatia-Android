name: Firebase Emulator Integration

run-name: "Firebase emulator integration - ${{ github.ref_name }} #${{ github.run_number }}"

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  merge_group:
    types: [ checks_requested ]
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: firebase-emulator-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  ANDROID_SERIAL: emulator-5554
  GRADLE_CI_MAX_WORKERS: 2
  GRADLE_CI_GRADLE_XMX: 5g
  GRADLE_CI_KOTLIN_XMX: 2g

jobs:
  change-scope:
    name: Classify Firebase integration changes
    runs-on: ubuntu-latest
    outputs:
      firebase_changed: ${{ steps.classify.outputs.firebase_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Classify relevant changes
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: bash ./.github/scripts/detect-change-scope.sh "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA"

  firebase-emulator-integration:
    needs: [ change-scope ]
    # Heavy tier: skip draft PRs; it runs once the PR is marked ready for review
    # (and on every later push), and on merge_group / dispatch.
    if: ${{ needs.change-scope.outputs.firebase_changed == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Auth + Firestore + Storage SDK emulator round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Firebase Emulator Suite requirement)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Set executable permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Prepare production Firebase application configuration
        env:
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 }}
        run: bash ./.github/scripts/prepare-google-services.sh prod

      - name: Resolve Firebase project ID for emulator namespace
        shell: bash
        run: |
          set -euo pipefail
          project_id="$(python3 -c 'import json; print(json.load(open("app/src/prod/google-services.json", encoding="utf-8"))["project_info"]["project_id"])')"
          [[ -n "$project_id" ]] || {
            echo "::error::Production google-services.json has no project ID."
            exit 1
          }
          echo "FIREBASE_PROJECT_ID=$project_id" >> "$GITHUB_ENV"

      - name: Verify Firebase protobuf Lite dependency graph
        shell: bash
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/firebase-protobuf-dependencies"
          mkdir -p "$report_dir"

          ./gradlew :app:dependencyInsight \
            --configuration prodDebugRuntimeClasspath \
            --dependency com.google.protobuf:protobuf-javalite \
            --no-configuration-cache --console=plain | tee "$report_dir/protobuf-javalite.txt"

          ./gradlew :app:dependencyInsight \
            --configuration prodDebugRuntimeClasspath \
            --dependency com.google.firebase:protolite-well-known-types \
            --no-configuration-cache --console=plain | tee "$report_dir/protolite-well-known-types.txt"

          ./gradlew :app:dependencyInsight \
            --configuration prodDebugRuntimeClasspath \
            --dependency com.google.protobuf:protobuf-java \
            --no-configuration-cache --console=plain | tee "$report_dir/protobuf-java.txt"

          grep -Fq "com.google.protobuf:protobuf-javalite" "$report_dir/protobuf-javalite.txt" || {
            echo "::error::The ProdDebug runtime does not resolve protobuf-javalite."
            exit 1
          }
          grep -Fq "com.google.firebase:protolite-well-known-types" "$report_dir/protolite-well-known-types.txt" || {
            echo "::error::Firebase Lite well-known types are missing from the ProdDebug runtime."
            exit 1
          }
          # Match the exact module coordinate; protobuf-javalite contains the
          # prefix "protobuf-java" but is the required Firebase-compatible runtime.
          if grep -Eq 'com\.google\.protobuf:protobuf-java:[0-9]' "$report_dir/protobuf-java.txt"; then
            echo "::error::The full protobuf-java runtime conflicts with Firebase's Lite runtime."
            exit 1
          fi

      - name: Compile production app and emulator integration test sources
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :app:compileProdDebugKotlin \
            :app:compileProdDebugAndroidTestKotlin \
            --no-configuration-cache --stacktrace --console=plain

      - name: Prepare KVM and Android Emulator
        run: bash ./.github/scripts/prepare-android-emulator.sh

      - name: Start connected Android Emulator
        run: bash ./.github/scripts/start-connected-android-emulator.sh

      - name: Run authenticated Firestore and Storage emulator integration
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.37.0 emulators:exec \
            --only auth,firestore,storage \
            --project "$FIREBASE_PROJECT_ID" \
            --config firebase.emulators.json \
            "bash ./.github/scripts/run-gradle-with-diagnostics.sh firebase-emulator-integration ./gradlew :app:connectedProdDebugAndroidTest -PfirebaseEmulatorIntegration=true -Pandroid.testInstrumentationRunnerArguments.class=com.estatia.realestate.apps.FirebaseEmulatorIntegrationTest --no-configuration-cache --stacktrace --console=plain"

      - name: Capture Android emulator diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          diagnostics_dir="$RUNNER_TEMP/firebase-emulator-integration"
          mkdir -p "$diagnostics_dir"
          adb="$ANDROID_HOME/platform-tools/adb"
          if [[ -x "$adb" ]] && "$adb" -s "$ANDROID_SERIAL" get-state >/dev/null 2>&1; then
            "$adb" -s "$ANDROID_SERIAL" logcat -d -v threadtime > "$diagnostics_dir/logcat.txt" 2>&1
            "$adb" -s "$ANDROID_SERIAL" shell dumpsys activity activities > "$diagnostics_dir/activity.txt" 2>&1
          fi

      - name: Stop connected Android Emulator
        if: always()
        run: bash ./.github/scripts/stop-connected-android-emulator.sh

      - name: Upload Firebase emulator integration reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firebase-emulator-integration-${{ github.run_id }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            ${{ runner.temp }}/gradle-ci-diagnostics/**
            ${{ runner.temp }}/firebase-emulator-integration/**
          if-no-files-found: warn
          retention-days: 7

  ci-gate:
    name: Firebase Integration Gate
    runs-on: ubuntu-latest
    needs:
      - change-scope
      - firebase-emulator-integration
    if: ${{ always() }}
    steps:
      - name: Checkout gate script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Verify all executed checks completed successfully
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci-gate.py
