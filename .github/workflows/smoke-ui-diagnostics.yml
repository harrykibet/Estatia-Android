name: Android Smoke UI Diagnostics

run-name: "Smoke UI diagnostics - ${{ github.ref_name }} #${{ github.run_number }}"

on:
  push:
    branches:
      - fix/protobuf-runtime-compatibility
    paths:
      - "app/**"
      - "core/**"
      - "feature/**"
      - "build-logic/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/libs.versions.toml"
      - ".github/scripts/prepare-google-services.sh"
      - ".github/scripts/run-gradle-with-diagnostics.sh"
      - ".github/actions/smoke-ui-local/**"
      - ".github/workflows/smoke-ui-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  ANDROID_SERIAL: emulator-5554

jobs:
  smoke-ui:
    name: DemoDebug + ProdDebug validation on local API 34 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GRADLE_CI_MAX_WORKERS: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Prepare Firebase configuration for demo and prod
        env:
          GOOGLE_SERVICES_JSON_DEMO_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_DEMO_BASE64 }}
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 }}
        run: bash ./.github/scripts/prepare-google-services.sh demo prod

      - name: Run DemoDebug and ProdDebug config and network unit tests
        shell: bash
        timeout-minutes: 12
        run: |
          bash ./.github/scripts/run-gradle-with-diagnostics.sh config-network-tests ./gradlew \
            :core:config:testDemoDebugUnitTest \
            :core:config:testProdDebugUnitTest \
            :core:network:compileDemoDebugUnitTestKotlin \
            :core:network:testDemoDebugUnitTest \
            :core:network:testProdDebugUnitTest \
            --no-configuration-cache --stacktrace --console=plain

      - name: Run shared local API 34 smoke UI diagnostics
        uses: ./.github/actions/smoke-ui-local
        with:
          artifact_name: smoke-ui-diagnostics-${{ github.run_number }}

      - name: Upload Gradle resource diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-resource-${{ github.run_number }}-${{ github.job }}
          path: ${{ runner.temp }}/gradle-ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 5
