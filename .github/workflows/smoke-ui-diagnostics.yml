name: Android Smoke UI Diagnostics

run-name: "Smoke UI diagnostics - ${{ github.ref_name }} #${{ github.run_number }}"

on:
  push:
    branches:
      - fix/protobuf-runtime-compatibility
    paths:
      - "app/**"
      - "core/**"
      - "feature/**"
      - "build-logic/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/libs.versions.toml"
      - ".github/scripts/prepare-google-services.sh"
      - ".github/workflows/smoke-ui-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  ANDROID_SERIAL: emulator-5554

jobs:
  smoke-ui:
    name: ProdDebug instrumentation on local API 34 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Install Android Emulator and API 34 system image
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail

          sdkmanager_path="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager_path" ]]; then
            sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          if [[ ! -x "$sdkmanager_path" ]]; then
            echo "::error::Android SDK sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager: $sdkmanager_path"
          (yes | "$sdkmanager_path" --licenses >/dev/null) || true

          "$sdkmanager_path" --install \
            "emulator" \
            "platform-tools" \
            "platforms;android-34" \
            "system-images;android-34;default;x86_64"

          test -x "$ANDROID_HOME/emulator/emulator"
          test -x "$ANDROID_HOME/platform-tools/adb"

          # sdkmanager installs platform-tools but does not guarantee adb is on PATH.
          # Persist this path for the emulator, diagnostics, and cleanup steps below.
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/platform-tools/adb" version

      - name: Diagnose runner virtualization and KVM
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail

          echo "=== Runner image ==="
          cat /etc/os-release
          uname -a
          echo "CPU count: $(nproc)"
          free -h

          echo "=== CPU virtualization flags ==="
          flags="$(grep -m1 '^flags' /proc/cpuinfo || true)"
          printf '%s\n' "$flags" | grep -oE '\b(vmx|svm)\b' | sort -u || true

          echo "=== KVM device ==="
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::/dev/kvm is not exposed to this GitHub-hosted runner."
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

          echo "=== Android Emulator hypervisor check ==="
          accel_output="$("$ANDROID_HOME/emulator/emulator" -accel-check 2>&1)" || {
            printf '%s\n' "$accel_output"
            echo "::error::The Android Emulator cannot use hardware virtualization on this runner."
            exit 1
          }
          printf '%s\n' "$accel_output"
          if ! grep -Eiq 'KVM.*(installed and usable|is usable)' <<< "$accel_output"; then
            echo "::error::The emulator did not confirm that KVM acceleration is usable."
            exit 1
          fi

      - name: Prepare Firebase configuration for prod
        env:
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 }}
        run: bash ./.github/scripts/prepare-google-services.sh prod

      - name: Build app and instrumentation APKs
        shell: bash
        timeout-minutes: 20
        run: |
          ./gradlew \
            :app:assembleProdDebug \
            :app:assembleProdDebugAndroidTest \
            --no-configuration-cache --stacktrace --console=plain

      - name: Create Pixel 2 API 34 AVD
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail

          avdmanager_path="$(command -v avdmanager || true)"
          if [[ -z "$avdmanager_path" ]]; then
            avdmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort -V | tail -n 1)"
          fi
          if [[ ! -x "$avdmanager_path" ]]; then
            echo "::error::Android SDK avdmanager was not found."
            exit 1
          fi

          printf 'no\n' | "$avdmanager_path" create avd \
            --force \
            --name estatia_pixel2_api34 \
            --package "system-images;android-34;default;x86_64" \
            --device "pixel_2"

          "$ANDROID_HOME/emulator/emulator" -list-avds

      - name: Boot emulator and wait for Android
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail

          emulator_log="$RUNNER_TEMP/estatia-emulator.log"
          "$ANDROID_HOME/emulator/emulator" \
            -avd estatia_pixel2_api34 \
            -port 5554 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader \
            -accel on \
            > "$emulator_log" 2>&1 &
          emulator_pid=$!
          echo "$emulator_pid" > "$RUNNER_TEMP/estatia-emulator.pid"

          if ! command -v adb >/dev/null 2>&1; then
            echo "::error::ADB is not on PATH after Android platform-tools installation."
            exit 1
          fi
          echo "Using ADB: $(command -v adb)"
          adb version
          adb start-server
          timeout 180s adb -s emulator-5554 wait-for-device

          booted=false
          for attempt in $(seq 1 90); do
            boot_state="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$boot_state" == "1" ]]; then
              booted=true
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "::error::The Android emulator process exited before boot completed."
              tail -n 250 "$emulator_log" || true
              exit 1
            fi
            sleep 2
          done

          if [[ "$booted" != "true" ]]; then
            echo "::error::The Android emulator did not finish booting within 180 seconds."
            adb devices -l || true
            tail -n 250 "$emulator_log" || true
            exit 1
          fi

          adb -s emulator-5554 shell getprop ro.build.version.release
          adb -s emulator-5554 shell getprop ro.build.version.sdk
          adb -s emulator-5554 shell wm size
          adb -s emulator-5554 shell wm density
          adb devices -l

      - name: Run connected ProdDebug UI tests
        shell: bash
        timeout-minutes: 22
        run: |
          set -o pipefail
          ./gradlew :app:connectedProdDebugAndroidTest \
            --no-configuration-cache --stacktrace --info --console=plain

      - name: Collect emulator and test diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          output="$RUNNER_TEMP/smoke-ui-diagnostics"
          mkdir -p "$output"

          {
            echo "UTC time: $(date -u --iso-8601=seconds)"
            echo "Runner: $RUNNER_OS"
            echo "Image:"
            cat /etc/os-release
            echo "CPU count: $(nproc)"
            echo "Memory:"
            free -h
            echo "Disk:"
            df -h /
            echo "KVM:"
            ls -l /dev/kvm
            echo "ADB devices:"
            adb devices -l
          } > "$output/runner-summary.txt" 2>&1

          if [[ -f "$RUNNER_TEMP/estatia-emulator.log" ]]; then
            tail -n 500 "$RUNNER_TEMP/estatia-emulator.log" > "$output/emulator.log"
          fi

          for result_dir in \
            app/build/reports/androidTests/connected \
            app/build/outputs/androidTest-results/connected; do
            if [[ -d "$result_dir" ]]; then
              destination="$output/$(basename "$(dirname "$result_dir")")-$(basename "$result_dir")"
              mkdir -p "$destination"
              cp -R "$result_dir"/. "$destination"/
            fi
          done

          find app/build/reports -maxdepth 4 -type f -name "*.html" -print 2>/dev/null \
            | head -n 50 > "$output/report-files.txt" || true

      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          adb -s emulator-5554 emu kill || true
          if [[ -f "$RUNNER_TEMP/estatia-emulator.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/estatia-emulator.pid")" 2>/dev/null || true
          fi

      - name: Upload smoke UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-ui-diagnostics-${{ github.run_number }}
          path: ${{ runner.temp }}/smoke-ui-diagnostics/
          if-no-files-found: warn
          retention-days: 5
