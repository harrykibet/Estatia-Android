name: Nightly Stress & Optimization

on:
  schedule:
    - cron: '0 0 * * *'  # Runs at midnight every day
  workflow_dispatch:      # Allow manual trigger

env:
  CI: true

jobs:
  chaos-tests:
    name: Deterministic Chaos Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Prepare Android CI configuration
        uses: ./.github/actions/setup-android-ci-config
        with:
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          maps-api-key: ${{ secrets.MAPS_API_KEY }}

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Run Feed Chaos Tests
        # Chaos tests are expensive, running them in Nightly
        run: ./gradlew :app:pixel6Api31ProdDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.estatia.realestate.apps.chaos.FeedGestureChaosTest

  baseline-profiles:
    name: Generate Baseline Profiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Prepare Android CI configuration
        uses: ./.github/actions/setup-android-ci-config
        with:
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          maps-api-key: ${{ secrets.MAPS_API_KEY }}

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Generate Baseline Profile
        run: ./gradlew :app:generateBaselineProfile --no-configuration-cache

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update baseline profiles (nightly)"
          branch: automation/baseline-profiles
          title: "Update Baseline Profiles (Nightly)"
          body: |
            Automated baseline profile generation from nightly run.
            This PR updates the baseline profiles to optimize app startup and performance based on latest changes.
          delete-branch: true
          labels: |
            automation
            performance

  benchmarks:
    name: Performance Macrobenchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Prepare Android CI configuration
        uses: ./.github/actions/setup-android-ci-config
        with:
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          maps-api-key: ${{ secrets.MAPS_API_KEY }}

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Assemble Release for Audit
        run: ./gradlew :app:assembleProdRelease --no-configuration-cache

      - name: Run Binary Purity Audit (R8)
        run: ./gradlew auditBinaryPurity --no-configuration-cache

      - name: Run Startup & Scroll Benchmarks
        run: ./gradlew :benchmark:pixel6Api31ProdDebugAndroidTest --no-configuration-cache --info

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark/build/outputs/connected_android_test_additional_output/

  quality-metrics:
    name: Code Quality & Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Prepare Android CI configuration
        uses: ./.github/actions/setup-android-ci-config
        with:
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          maps-api-key: ${{ secrets.MAPS_API_KEY }}

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Full Variant Architecture Audit
        # 🏗️ EXHAUSTIVE AUDIT: Run architecture verification on ALL variants nightly.
        run: ./gradlew verifyArchitecture lint --no-configuration-cache --info

      - name: Run Full Coverage Report
        run: ./gradlew jacocoProdDebugReport --no-configuration-cache --info

      - name: Upload Quality Reports
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            **/build/reports/jacoco/**
            **/build/test-results/**

  security-scan:
    name: Resolved Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Prepare Android CI configuration
        uses: ./.github/actions/setup-android-ci-config
        with:
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          maps-api-key: ${{ secrets.MAPS_API_KEY }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Cache OWASP Dependency-Check database
        uses: actions/cache@v6
        with:
          path: ~/.gradle/dependency-check-data/11.0
          key: dependency-check-${{ runner.os }}-v12.2-${{ github.run_id }}
          restore-keys: |
            dependency-check-${{ runner.os }}-v12.2-

      - name: Analyze Resolved Gradle Dependencies
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAggregate --no-configuration-cache --no-parallel --info

      - name: Verify Non-Empty Dependency Inventory
        if: success()
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          report = pathlib.Path("build/reports/dependency-check/dependency-check-report.json")
          if not report.is_file():
              sys.exit(f"Missing dependency inventory report: {report}")

          payload = json.loads(report.read_text(encoding="utf-8"))
          dependencies = payload.get("dependencies")
          if not isinstance(dependencies, list) or not dependencies:
              sys.exit("Dependency-Check analyzed zero dependencies; refusing a false-green security result.")

          print(f"Dependency-Check reported {len(dependencies)} dependency entries.")
          PY

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: build/reports/dependency-check/
          if-no-files-found: warn
          retention-days: 14
