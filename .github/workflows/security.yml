name: Dependency Security Scan

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-security-${{  github.event.pull_request.number || github.ref  }}
  cancel-in-progress: ${{  github.event_name == 'pull_request'  }}

jobs:
  dependency-change-detection:
    name: Detect Dependency Changes
    runs-on: ubuntu-latest
    outputs:
      dependencies: ${{  steps.filter.outputs.dependencies  }}
    steps:
      - name: Check Dependency-Related Paths
        if: ${{  github.event_name == 'pull_request'  }}
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dependencies:
              - '**/*.gradle'
              - '**/*.gradle.kts'
              - '**/settings.gradle'
              - '**/settings.gradle.kts'
              - '**/gradle.properties'
              - 'gradle/**'
              - 'build-logic/**'
              - 'buildSrc/**'
              - '*.gradle'
              - '*.gradle.kts'
              - '.github/dependabot.yml'
              - '.github/dependabot.yaml'

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: [ dependency-change-detection ]
    if: ${{  github.event_name != 'pull_request' || needs.dependency-change-detection.outputs.dependencies == 'true'  }}
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Restore Dependency-Check database cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: owasp-dependency-check-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            owasp-dependency-check-${{ runner.os }}-

      - name: Run OWASP Dependency Check with NVD API
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/dependency-check-data" "$GITHUB_WORKSPACE/reports"

          if [[ -n "${NVD_API_KEY:-}" ]]; then
            nvd_api_args=(--nvdApiKey "$NVD_API_KEY" --nvdApiDelay 3500)
            echo "NVD API authentication is configured."
          elif [[ "$PR_HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            nvd_api_args=()
            echo "::warning::NVD_API_KEY is not available to fork pull requests; scanning will use unauthenticated NVD access."
          else
            echo "::error::The repository secret NVD_API_KEY is required for this repository's Dependency-Check scan."
            exit 1
          fi

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$RUNNER_TEMP/dependency-check-data:/usr/share/dependency-check/data" \
            --volume "$GITHUB_WORKSPACE/reports:/report" \
            owasp/dependency-check:13.0.0 \
            --project Estatia \
            --scan /src \
            --format HTML \
            --out /report \
            --nvdValidForHours 4 \
            --exclude "/src/.git/**" \
            --exclude "/src/.gradle/**" \
            --exclude "/src/**/build/**" \
            "${nvd_api_args[@]}"

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: dependency-report
          path: reports
          if-no-files-found: warn
