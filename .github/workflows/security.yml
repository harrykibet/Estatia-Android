name: Dependency Security Scan

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    name: Scan Resolved Gradle Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Prepare Android CI configuration
        uses: ./.github/actions/setup-android-ci-config
        with:
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          maps-api-key: ${{ secrets.MAPS_API_KEY }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Require NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [[ -z "${NVD_API_KEY//[[:space:]]/}" ]]; then
            echo "::error::The repository Actions secret NVD_API_KEY is required for authenticated NVD vulnerability updates."
            echo "::error::Create an NVD API key at https://nvd.nist.gov/developers/request-an-api-key and add it under Settings > Secrets and variables > Actions as NVD_API_KEY."
            exit 1
          fi

      - name: Restore OWASP Dependency-Check database
        id: dependency-check-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/dependency-check-data/11.0
          key: dependency-check-${{ runner.os }}-v13.0-${{ github.run_id }}
          restore-keys: |
            dependency-check-${{ runner.os }}-v13.0-
            dependency-check-${{ runner.os }}-v12.2-

      - name: Analyze Resolved Gradle Dependencies
        id: dependency-check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        shell: bash
        run: |
          set -uo pipefail

          # Run Dependency-Check exactly once. HTTP 503 responses that the
          # scanner successfully retries internally must not cause us to erase
          # a complete database and restart the full NVD download.
          log_file="${RUNNER_TEMP}/dependency-check.log"
          set +e
          ./gradlew dependencyCheckAggregate --no-configuration-cache --no-parallel --info 2>&1 | tee "$log_file"
          scan_status=${PIPESTATUS[0]}
          set -e

          # CVSS-threshold failures happen after the database update and report
          # generation. Preserve that completed database even though the
          # security gate will fail below. Do not cache an interrupted refresh.
          if grep -Fq "Check for updates complete" "$log_file" &&
             [[ -d "$HOME/.gradle/dependency-check-data/11.0" ]]; then
            echo "database-ready=true" >> "$GITHUB_OUTPUT"
            echo "Dependency-Check database refresh completed; eligible for cache save."
          else
            echo "database-ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency-Check did not confirm a completed database refresh; the database will not be cached."
          fi

          exit "$scan_status"

      - name: Verify Dependency-Check Reports and Inventory
        id: verify-dependency-report
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          report_dir = pathlib.Path("build/reports/dependency-check")
          json_report = report_dir / "dependency-check-report.json"
          html_report = report_dir / "dependency-check-report.html"

          missing = [str(path) for path in (json_report, html_report) if not path.is_file()]
          if missing:
              sys.exit("Missing Dependency-Check report(s): " + ", ".join(missing))

          try:
              payload = json.loads(json_report.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as error:
              sys.exit(f"Dependency-Check JSON report is unreadable: {error}")

          dependencies = payload.get("dependencies")
          if not isinstance(dependencies, list) or not dependencies:
              sys.exit("Dependency-Check analyzed zero dependencies; refusing a false-green security result.")

          print(f"Dependency-Check reported {len(dependencies)} dependency entries.")
          print(f"HTML report: {html_report.stat().st_size} bytes")
          print(f"JSON report: {json_report.stat().st_size} bytes")
          PY

      - name: Save completed OWASP Dependency-Check database
        if: always() && !cancelled() && steps.dependency-check.outputs.database-ready == 'true' && steps.dependency-check-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.gradle/dependency-check-data/11.0
          key: dependency-check-${{ runner.os }}-v13.0-${{ github.run_id }}

      - name: Upload Dependency Security Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-report
          path: |
            build/reports/dependency-check/dependency-check-report.html
            build/reports/dependency-check/dependency-check-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Dependency Security Result
        if: always() && (steps.dependency-check.outcome != 'success' || steps.verify-dependency-report.outcome != 'success')
        run: |
          echo "::error::Dependency security validation failed. Review the uploaded Dependency-Check reports and scan log."
          exit 1
