name: Dependency Security Scan

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-security-${{  github.event.pull_request.number || github.ref  }}
  cancel-in-progress: ${{  github.event_name == 'pull_request'  }}

jobs:
  dependency-change-detection:
    name: Detect Dependency Changes
    runs-on: ubuntu-latest
    outputs:
      dependencies: ${{  steps.filter.outputs.dependencies  }}
    steps:
      - name: Check Dependency-Related Paths
        if: ${{  github.event_name == 'pull_request'  }}
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dependencies:
              - '**/*.gradle'
              - '**/*.gradle.kts'
              - '**/settings.gradle'
              - '**/settings.gradle.kts'
              - '**/gradle.properties'
              - 'gradle/**'
              - 'build-logic/**'
              - 'buildSrc/**'
              - '*.gradle'
              - '*.gradle.kts'
              - '.github/dependabot.yml'
              - '.github/dependabot.yaml'

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: [ dependency-change-detection ]
    if: ${{  github.event_name != 'pull_request' || needs.dependency-change-detection.outputs.dependencies == 'true'  }}
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: Estatia
          path: "."
          format: "HTML"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: reports
          if-no-files-found: warn
