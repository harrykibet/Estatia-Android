name: Dependency Security Scan

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-change-detection:
    name: Detect Dependency Changes
    runs-on: ubuntu-latest
    outputs:
      dependencies: ${{ steps.filter.outputs.dependencies }}
    steps:
      - name: Check Dependency-Related Paths
        if: ${{ github.event_name == 'pull_request' }}
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            dependencies:
              - '**/*.gradle'
              - '**/*.gradle.kts'
              - '**/settings.gradle'
              - '**/settings.gradle.kts'
              - '**/gradle.properties'
              - 'gradle/**'
              - 'build-logic/**'
              - 'buildSrc/**'
              - '*.gradle'
              - '*.gradle.kts'
              - '.github/dependabot.yml'
              - '.github/dependabot.yaml'
              - '.github/workflows/security.yml'
              - '.github/scripts/owasp-dependency-check.init.gradle'
              - 'dependency-check-suppressions.xml'

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: [ dependency-change-detection ]
    # Dependency analysis is part of the heavy tier: skip drafts, run when
    # the PR becomes ready, and rerun on every later push that changes
    # dependency-related inputs. Scheduled/manual runs remain exhaustive.
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.dependency-change-detection.outputs.dependencies == 'true') }}
    timeout-minutes: 45
    env:
      GRADLE_CI_MAX_WORKERS: 1
      GRADLE_CI_GRADLE_XMX: 5g
      GRADLE_CI_KOTLIN_XMX: 1536m
      GRADLE_CI_PARALLEL: "false"
      GRADLE_CI_KOTLIN_PARALLEL: "false"
      GRADLE_CI_SAMPLE_SECONDS: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android local.properties
        shell: bash
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Restore Dependency-Check database cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: owasp-dependency-check-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            owasp-dependency-check-${{ runner.os }}-

      - name: Verify Kotlin Gradle plugin is patched in build logic
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/kotlin-gradle-plugin-dependency.txt"
          bash ./.github/scripts/run-gradle-with-diagnostics.sh security-kotlin-plugin-insight \
            ./gradlew -p build-logic :convention:dependencyInsight \
            --configuration compileClasspath \
            --dependency org.jetbrains.kotlin:kotlin-gradle-plugin \
            --no-configuration-cache --console=plain | tee "$report"
          if ! grep -Fq "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21" "$report"; then
            echo "::error::The build-logic classpath must resolve the patched Kotlin Gradle plugin 2.4.21."
            exit 1
          fi

      - name: Run OWASP Dependency Check against resolved Gradle dependencies
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          ODC_DATA_DIRECTORY: ${{ runner.temp }}/dependency-check-data
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dependency-check-data" "$GITHUB_WORKSPACE/reports"

          if [[ -z "${NVD_API_KEY:-}" ]]; then
            if [[ "$PR_HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
              echo "::warning::NVD_API_KEY is not available to fork pull requests; Dependency-Check will use unauthenticated NVD access."
            else
              echo "::error::The repository secret NVD_API_KEY is required for this repository's Dependency-Check scan."
              exit 1
            fi
          else
            echo "NVD API authentication is configured."
          fi

          chmod +x ./gradlew
          bash ./.github/scripts/run-gradle-with-diagnostics.sh owasp-dependency-check \
            ./gradlew \
            --init-script .github/scripts/owasp-dependency-check.init.gradle \
            :app:dependencyCheckAnalyze \
            --no-configuration-cache --stacktrace --console=plain

      - name: Verify Dependency-Check scanned the Gradle dependency graph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("reports/dependency-check-report.json")
          if not report_path.is_file():
              raise SystemExit(
                  "::error::Dependency-Check did not generate its JSON dependency inventory."
              )

          report = json.loads(report_path.read_text(encoding="utf-8"))
          dependencies = report.get("dependencies")
          if not isinstance(dependencies, list):
              raise SystemExit(
                  "::error::Dependency-Check JSON has no dependencies array; refusing an empty scan."
              )

          identified = [
              dependency for dependency in dependencies
              if isinstance(dependency, dict)
              and (
                  dependency.get("fileName")
                  or dependency.get("packages")
                  or dependency.get("identifiers")
              )
          ]
          print(f"Dependency-Check inventory entries: {len(identified)}")
          if len(identified) < 25:
              raise SystemExit(
                  "::error::Dependency-Check found fewer than 25 dependency entries. "
                  "The Gradle dependency graph may not have been scanned."
              )
          print("Resolved Gradle dependency inventory validation passed.")
          PY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-report
          path: reports
          if-no-files-found: warn

      - name: Upload Gradle resource diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-resource-${{ github.run_number }}-dependency-check
          path: ${{ runner.temp }}/gradle-ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 5

  ci-gate:
    name: Dependency Security Gate
    runs-on: ubuntu-latest
    needs:
      - dependency-change-detection
      - dependency-check
    if: ${{ always() }}
    steps:
      - name: Checkout gate script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Verify all executed checks completed successfully
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci-gate.py
