name: Dependency Security Scan

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    name: Scan Resolved Gradle Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Prepare Android CI configuration
        uses: ./.github/actions/setup-android-ci-config
        with:
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          maps-api-key: ${{ secrets.MAPS_API_KEY }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Require NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [[ -z "${NVD_API_KEY//[[:space:]]/}" ]]; then
            echo "::error::The repository Actions secret NVD_API_KEY is required for authenticated NVD vulnerability updates."
            echo "::error::Create an NVD API key at https://nvd.nist.gov/developers/request-an-api-key and add it under Settings > Secrets and variables > Actions as NVD_API_KEY."
            exit 1
          fi

      - name: Cache OWASP Dependency-Check database
        uses: actions/cache@v6
        with:
          path: ~/.gradle/dependency-check-data/11.0
          key: dependency-check-${{ runner.os }}-v13.0-${{ github.run_id }}
          restore-keys: |
            dependency-check-${{ runner.os }}-v13.0-

      - name: Analyze Resolved Gradle Dependencies
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          # Retry only transient NVD availability/rate-limit failures and the
          # known H2 shutdown symptoms they can trigger in Dependency-Check.
          # Each retry starts with a clean NVD database; failOnError remains true.
          for attempt in 1 2 3; do
            log_file="${RUNNER_TEMP}/dependency-check-attempt-${attempt}.log"
            rm -f "$log_file"

            set +e
            ./gradlew dependencyCheckAggregate --no-configuration-cache --no-parallel --info 2>&1 | tee "$log_file"
            scan_status=${PIPESTATUS[0]}
            set -e

            if [[ "$scan_status" -eq 0 ]]; then
              exit 0
            fi

            if ! grep -Eiq 'responded with status (429|500|502|503|504)|MVStoreException|connectionPool is null' "$log_file"; then
              echo "::error::Dependency-Check failed for a non-transient reason; refusing to retry or downgrade the security gate."
              exit "$scan_status"
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Dependency-Check still failed after three attempts."
              exit "$scan_status"
            fi

            echo "::warning::NVD returned a transient error (attempt $attempt/3). Clearing the partial H2 database and retrying after backoff."
            rm -rf "$HOME/.gradle/dependency-check-data/11.0"
            rm -rf build/reports/dependency-check
            sleep $((attempt * 45))
          done

      - name: Verify Non-Empty Dependency Inventory
        if: success()
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          report = pathlib.Path("build/reports/dependency-check/dependency-check-report.json")
          if not report.is_file():
              sys.exit(f"Missing dependency inventory report: {report}")

          payload = json.loads(report.read_text(encoding="utf-8"))
          dependencies = payload.get("dependencies")
          if not isinstance(dependencies, list) or not dependencies:
              sys.exit("Dependency-Check analyzed zero dependencies; refusing a false-green security result.")

          print(f"Dependency-Check reported {len(dependencies)} dependency entries.")
          PY

      - name: Upload Dependency Security Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-report
          path: build/reports/dependency-check/
          if-no-files-found: warn
          retention-days: 14
