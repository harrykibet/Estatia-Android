name: Orphaned Branch Audit

on:
  schedule:
    # 04:17 Africa/Nairobi (UTC+3).
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      stale_days:
        description: 'Mark branches with no commits for at least this many days as stale.'
        required: true
        default: '14'
        type: string
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: orphaned-branch-audit-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit branch topology, patch equivalence, and PR history
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.base.ref == github.event.repository.default_branch) &&
      (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the default branch with full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Verify audit code and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/audit-orphaned-branches.py
          python3 -m unittest discover -s .github/scripts/tests -p 'test_audit_orphaned_branches.py' -v

      - name: Audit all remote branches against the default branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STALE_DAYS: ${{ inputs.stale_days || '14' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/audit-orphaned-branches.py \
            --repo "${GITHUB_REPOSITORY}" \
            --stale-days "${STALE_DAYS}" \
            --output-dir orphaned-branch-audit

      - name: Upload Markdown and machine-readable audit reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: orphaned-branch-audit-${{ github.run_id }}
          path: orphaned-branch-audit/
          if-no-files-found: error
          retention-days: 90
