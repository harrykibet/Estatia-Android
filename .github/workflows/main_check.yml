name: Main Branch Verification

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: main-verification-${{  github.ref  }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  GRADLE_CI_MAX_WORKERS: 2
  GRADLE_CI_GRADLE_XMX: 5g
  GRADLE_CI_KOTLIN_XMX: 2g

jobs:
  change-scope:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
      tooling_only: ${{ steps.classify.outputs.tooling_only }}
      tooling_changed: ${{ steps.classify.outputs.tooling_changed }}
      source_changed: ${{ steps.classify.outputs.source_changed }}
      gradle_changed: ${{ steps.classify.outputs.gradle_changed }}
      architecture_changed: ${{ steps.classify.outputs.architecture_changed }}
      release_changed: ${{ steps.classify.outputs.release_changed }}
      smoke_changed: ${{ steps.classify.outputs.smoke_changed }}
      unknown_changed: ${{ steps.classify.outputs.unknown_changed }}
      module_gradle_changed: ${{ steps.classify.outputs.module_gradle_changed }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Detect documentation-only changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: bash ./.github/scripts/detect-change-scope.sh "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA"

  documentation-validation:
    name: Documentation and issue-form validation
    runs-on: ubuntu-latest
    needs: [ change-scope ]
    if: ${{ needs.change-scope.outputs.docs_changed == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate changed Markdown and GitHub issue forms
        env:
          BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 ./.github/scripts/validate-documentation.py "$BASE_SHA" "$HEAD_SHA"

  tooling-validation:
    name: Script and workflow syntax validation
    runs-on: ubuntu-latest
    needs: [ change-scope ]
    if: ${{ needs.change-scope.outputs.tooling_changed == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install ShellCheck
        shell: bash
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y shellcheck
          fi
          shellcheck --version

      - name: Validate changed scripts and configuration
        env:
          BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 ./.github/scripts/validate-tooling.py "$BASE_SHA" "$HEAD_SHA"

  gradle-configuration-validation:
    name: Gradle configuration validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ change-scope ]
    if: ${{ needs.change-scope.outputs.gradle_changed == 'true' && needs.change-scope.outputs.architecture_changed != 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Prepare Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_DEMO_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_DEMO_BASE64 }}
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 }}
        run: bash ./.github/scripts/prepare-google-services.sh demo prod

      - name: Validate Gradle project configuration
        run: |
          chmod +x ./gradlew
          bash ./.github/scripts/run-gradle-with-diagnostics.sh main-gradle-configuration ./gradlew help --no-configuration-cache --stacktrace --console=plain

  impact-analysis:
    name: Calculate affected module verification tasks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [ change-scope ]
    if: ${{ (needs.change-scope.outputs.source_changed == 'true' || needs.change-scope.outputs.module_gradle_changed == 'true') && github.event_name != 'workflow_dispatch' }}
    outputs:
      impact_tasks: ${{ steps.impact.outputs.tasks }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Firebase configuration for impact analysis
        env:
          GOOGLE_SERVICES_JSON_DEMO_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_DEMO_BASE64 }}
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 }}
        run: bash ./.github/scripts/prepare-google-services.sh demo prod

      - name: Calculate impacted module tasks
        id: impact
        env:
          ESTATIA_IMPACT_BASE: ${{ github.event.before || '' }}
          ESTATIA_IMPACT_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ESTATIA_IMPACT_BASE" || "$ESTATIA_IMPACT_BASE" =~ ^0+$ ]]; then
            echo "::error::Push event has no valid before SHA; refusing to select partial checks."
            exit 1
          fi
          chmod +x ./gradlew
          bash ./.github/scripts/run-gradle-with-diagnostics.sh impact-calculation ./gradlew calculateImpact --no-configuration-cache --console=plain | tee impact_output.txt
          tasks="$(sed -n 's/^IMPACT_TASKS=//p' impact_output.txt | tail -n 1)"
          if [[ -z "$tasks" ]]; then
            echo "::error::Source changes did not resolve to any verification tasks."
            exit 1
          fi
          if [[ "$tasks" == "test lint" ]]; then
            echo "::warning::Impact analysis selected the conservative full unit-test/lint fallback."
          fi
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
          echo "Selected impacted tasks: $tasks"

      - name: Upload Gradle resource diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-resource-${{ github.run_number }}-${{ github.job }}
          path: ${{ runner.temp }}/gradle-ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 5

  selective-verification:
    name: Impacted module compile, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [ impact-analysis ]
    if: ${{ needs.impact-analysis.outputs.impact_tasks != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Prepare Firebase configuration for impacted verification
        env:
          GOOGLE_SERVICES_JSON_DEMO_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_DEMO_BASE64 }}
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 }}
        run: bash ./.github/scripts/prepare-google-services.sh demo prod

      - name: Run impacted module tasks
        env:
          IMPACT_TASKS: ${{ needs.impact-analysis.outputs.impact_tasks }}
        shell: bash
        run: |
          read -r -a tasks <<< "$IMPACT_TASKS"
          bash ./.github/scripts/run-gradle-with-diagnostics.sh impacted-verification ./gradlew "${tasks[@]}" --no-configuration-cache --stacktrace --console=plain

      - name: Upload Gradle resource diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-resource-${{ github.run_number }}-${{ github.job }}
          path: ${{ runner.temp }}/gradle-ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 5

  lint:
    needs: [ change-scope ]
    if: ${{ needs.change-scope.outputs.architecture_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Prepare Firebase configuration (Demo + Prod)
        env:
          GOOGLE_SERVICES_JSON_DEMO_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_DEMO_BASE64  }}
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_PROD_BASE64  }}
        run: bash ./.github/scripts/prepare-google-services.sh demo prod

      - name: Run Architecture and Full Lint Gates
        run: bash ./.github/scripts/run-gradle-with-diagnostics.sh main-architecture-lint ./gradlew verifyArchitecture lint --no-configuration-cache --stacktrace --console=plain

      - name: Test Build Logic Convention Plugins
        run: bash ./.github/scripts/run-gradle-with-diagnostics.sh main-convention-tests ./gradlew -p build-logic :convention:test --no-configuration-cache --stacktrace --console=plain

      - name: Upload Lint Diagnostic Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-diagnostics
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.sarif
          if-no-files-found: warn

      - name: Upload Gradle resource diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-resource-${{ github.run_number }}-lint
          path: ${{ runner.temp }}/gradle-ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 5

  unit-tests:
    needs: [ change-scope ]
    if: ${{ needs.change-scope.outputs.architecture_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    name: Full Unit Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Prepare Firebase configuration (Demo + Prod)
        env:
          GOOGLE_SERVICES_JSON_DEMO_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_DEMO_BASE64  }}
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_PROD_BASE64  }}
        run: bash ./.github/scripts/prepare-google-services.sh demo prod

      - name: Run All Unit Tests
        run: bash ./.github/scripts/run-gradle-with-diagnostics.sh main-unit-tests ./gradlew test --no-configuration-cache --stacktrace --console=plain

      - name: Upload Gradle resource diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-resource-${{ github.run_number }}-unit-tests
          path: ${{ runner.temp }}/gradle-ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 5

  instrumented-tests:
    needs: [ change-scope, selective-verification ]
    if: ${{ always() && ((needs.change-scope.outputs.smoke_changed == 'true' && (needs.selective-verification.result == 'success' || needs.change-scope.outputs.source_changed != 'true')) || github.event_name == 'workflow_dispatch') }}
    name: Targeted UI Smoke or Full Device Fleet
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_CI_MAX_WORKERS: 1
      GRADLE_CI_GRADLE_XMX: 4608m
      GRADLE_CI_KOTLIN_XMX: 1536m
      GRADLE_CI_PARALLEL: "false"
      GRADLE_CI_KOTLIN_PARALLEL: "false"
      GRADLE_CI_SAMPLE_SECONDS: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Prepare KVM and Android Emulator
        run: bash ./.github/scripts/prepare-android-emulator.sh

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Prepare Firebase configuration (Demo + Prod)
        env:
          GOOGLE_SERVICES_JSON_DEMO_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_DEMO_BASE64  }}
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_PROD_BASE64  }}
        run: bash ./.github/scripts/prepare-google-services.sh demo prod

      - name: Run targeted UI smoke or full device fleet
        env:
          FULL_DEVICE_FLEET: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          if [[ "$FULL_DEVICE_FLEET" == "true" ]]; then
            tasks=(
              :app:pixel2Api34ProdDebugAndroidTest
              :app:pixel6Api31ProdDebugAndroidTest
              :app:mediumPhoneApi33ProdDebugAndroidTest
              :app:pixelTabletApi34ProdDebugAndroidTest
            )
          else
            tasks=( :app:pixel2Api34ProdDebugAndroidTest )
          fi
          bash ./.github/scripts/run-gradle-with-diagnostics.sh main-ui-verification ./gradlew "${tasks[@]}" --no-configuration-cache --stacktrace --console=plain

      - name: Upload Gradle resource diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-resource-${{ github.run_number }}-instrumented-tests
          path: ${{ runner.temp }}/gradle-ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 5

  build-release:
    needs: [ change-scope, gradle-configuration-validation, lint, selective-verification ]
    if: ${{ always() && (needs.change-scope.outputs.release_changed == 'true' || github.event_name == 'workflow_dispatch') && (needs.gradle-configuration-validation.result == 'success' || needs.gradle-configuration-validation.result == 'skipped') && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && (needs.selective-verification.result == 'success' || (needs.change-scope.outputs.source_changed != 'true' && needs.change-scope.outputs.module_gradle_changed != 'true') || github.event_name == 'workflow_dispatch') }}
    name: Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Prepare Firebase configuration (Demo + Prod)
        env:
          GOOGLE_SERVICES_JSON_DEMO_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_DEMO_BASE64  }}
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_PROD_BASE64  }}
        run: bash ./.github/scripts/prepare-google-services.sh demo prod

      - name: Prepare and validate release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ./.github/scripts/prepare-release-keystore.sh

      - name: Build Demo and Production APKs with Gradle (Release)
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ./.github/scripts/run-gradle-with-diagnostics.sh signed-dual-flavor-release ./gradlew assembleDemoRelease assembleProdRelease --no-configuration-cache --stacktrace --console=plain

      - name: Verify both APK signatures
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          test -x "$apksigner"
          for flavor in demo prod; do
            apk="app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            test -s "$apk"
            "$apksigner" verify "$apk"
            echo "Verified signed $flavor release APK."
          done

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-apks
          path: |
            app/build/outputs/apk/demo/release/app-demo-release.apk
            app/build/outputs/apk/prod/release/app-prod-release.apk
          if-no-files-found: error

      - name: Upload Gradle resource diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-resource-${{ github.run_number }}-build-release
          path: ${{ runner.temp }}/gradle-ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 5

  ci-gate:
    name: Main CI Gate
    runs-on: ubuntu-latest
    needs:
      - change-scope
      - documentation-validation
      - tooling-validation
      - gradle-configuration-validation
      - impact-analysis
      - selective-verification
      - lint
      - unit-tests
      - instrumented-tests
      - build-release
    if: ${{ always() }}
    steps:
      - name: Checkout gate script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Verify all executed checks completed successfully
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci-gate.py
