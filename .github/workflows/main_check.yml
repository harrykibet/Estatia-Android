name: Main Branch Verification

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: main-verification-${{  github.ref  }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Prepare Firebase configuration (Demo + Prod)
        env:
          GOOGLE_SERVICES_JSON_DEMO_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_DEMO_BASE64  }}
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_PROD_BASE64  }}
        run: bash ./.github/scripts/prepare-google-services.sh demo prod

      - name: Run Full Lint
        run: ./gradlew lint --no-configuration-cache --stacktrace --console=plain

      - name: Upload Lint Diagnostic Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.sarif
          if-no-files-found: warn

  unit-tests:
    name: Full Unit Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Prepare Firebase configuration (Demo + Prod)
        env:
          GOOGLE_SERVICES_JSON_DEMO_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_DEMO_BASE64  }}
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_PROD_BASE64  }}
        run: bash ./.github/scripts/prepare-google-services.sh demo prod

      - name: Run All Unit Tests
        run: ./gradlew test --no-configuration-cache --stacktrace --console=plain

  instrumented-tests:
    name: Full Instrumented Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Prepare Firebase configuration (Demo + Prod)
        env:
          GOOGLE_SERVICES_JSON_DEMO_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_DEMO_BASE64  }}
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_PROD_BASE64  }}
        run: bash ./.github/scripts/prepare-google-services.sh demo prod

      - name: Run All Instrumented Tests
        run: |
          ./gradlew \
            :app:pixel2Api34ProdDebugAndroidTest \
            :app:pixel6Api31ProdDebugAndroidTest \
            :app:mediumPhoneApi33ProdDebugAndroidTest \
            :app:pixelTabletApi34ProdDebugAndroidTest \
            --no-configuration-cache --stacktrace --console=plain

  build-release:
    name: Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Prepare Firebase configuration (Demo + Prod)
        env:
          GOOGLE_SERVICES_JSON_DEMO_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_DEMO_BASE64  }}
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{  secrets.GOOGLE_SERVICES_JSON_PROD_BASE64  }}
        run: bash ./.github/scripts/prepare-google-services.sh demo prod

      - name: Decode and Store Keystore
        env:
          KEYSTORE_BASE64: ${{  secrets.KEYSTORE_BASE64  }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > local_keystore.jks
          test -s local_keystore.jks

      - name: Build Demo and Production APKs with Gradle (Release)
        env:
          RELEASE_STORE_PASSWORD: ${{  secrets.KEYSTORE_PASSWORD  }}
          RELEASE_KEY_ALIAS: ${{  secrets.KEY_ALIAS  }}
          RELEASE_KEY_PASSWORD: ${{  secrets.KEY_PASSWORD  }}
        run: ./gradlew assembleDemoRelease assembleProdRelease -PsigningStoreFile=local_keystore.jks --stacktrace --console=plain

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            app/build/outputs/apk/demo/release/app-demo-release.apk
            app/build/outputs/apk/prod/release/app-prod-release.apk
          if-no-files-found: error
