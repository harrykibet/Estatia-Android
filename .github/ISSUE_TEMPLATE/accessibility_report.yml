name: Accessibility barrier
description: Report a barrier that makes an Estatia task difficult or impossible to complete.
title: "[Accessibility]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form to report accessibility barriers in Estatia. Do not include personal or production data. Suspected security vulnerabilities must be reported privately through SECURITY.md.
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: Describe the task and the screen or flow where the barrier occurred.
      placeholder: "I was trying to ..."
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: Describe the accessibility barrier
      description: Explain what prevented or made the task difficult to complete.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How does this barrier affect the task?
      options:
        - Blocks completion of a core task
        - Makes a task difficult, slow, or error-prone
        - Causes confusing or missing information
        - Other or unsure
    validations:
      required: true
  - type: dropdown
    id: assistive-technology
    attributes:
      label: Assistive technology or accessibility setting
      multiple: true
      options:
        - TalkBack
        - Switch Access
        - External keyboard
        - Magnification or enlarged display size
        - Increased font size
        - Color correction or contrast setting
        - Captions or audio alternative
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the steps that expose the barrier.
      placeholder: |
        1. Open ...
        2. Navigate to ...
        3. Try to ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected accessible behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include relevant announcement, focus, or visual behavior.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      description: Include the device model and Android/API version when known.
      placeholder: "Pixel 8, Android 15 (API 35)"
    validations:
      required: false
  - type: input
    id: app-version
    attributes:
      label: App version or commit
      description: Include the app version, build, or commit when known.
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Additional context
      description: Add sanitized logs or screenshots only when they help explain the barrier. Redact personal and production information.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched for an existing report of this barrier.
          required: true
        - label: I removed personal information, secrets, and production data from this report.
          required: true
