name: Bug report
description: Report a reproducible defect in Estatia.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for reproducible defects. For security vulnerabilities, do not submit a public issue; use the private reporting instructions in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Describe the bug
      description: A concise description of the unexpected behavior.
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence of steps.
      placeholder: |
        1. Open ...
        2. Navigate to ...
        3. Perform ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include relevant error messages if safe to share.
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Affected module or screen
      description: For example, :feature:home, :core:network, or the screen name.
      placeholder: ":feature:home"
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: App version or commit
      description: Include the app version, build number, or commit SHA when known.
    validations:
      required: false
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Android emulator
        - Physical Android device
        - CI / GitHub Actions
        - Build or static-analysis environment
        - Other
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
      description: Include Android API level and device model when relevant.
      placeholder: "Android 15 (API 35), Pixel ..."
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Logs or additional context
      description: Add minimal, redacted logs or screenshots that help reproduce the problem. Remove credentials, tokens, personal information, and production data.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets and personal or production data from this report.
          required: true
